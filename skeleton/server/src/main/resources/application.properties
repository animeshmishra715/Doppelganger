spring.application.name=doppelganger-server

# Local dev: H2 in a file under ./data. Set SPRING_DATASOURCE_URL (and username/password) for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/doppelganger
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
